# Dokploy (deploy.mags.dk) has no free Docker address pools, so this file joins the
# existing dokploy-network instead of creating a bridge network.
# Local database: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d database

networks:
  default:
    name: dokploy-network
    external: true

services:
  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      default:
        aliases:
          - treasuresweeper-db

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
      ConnectionStrings__Default: Host=treasuresweeper-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SSL Mode=Disable
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.treasuresweeper-web.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      default:
        aliases:
          - treasuresweeper-web

volumes:
  pgdata:
